<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حسام محسن حسن | بطاقة أعمال رقمية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:
linear-gradient(135deg,#030712,#111827,#0f172a);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.card{
width:100%;
max-width:430px;
background:rgba(17,24,39,.95);
border:1px solid rgba(212,175,55,.3);
border-radius:30px;
padding:25px;
backdrop-filter:blur(12px);

box-shadow:
0 0 25px rgba(212,175,55,.15),
0 20px 40px rgba(0,0,0,.6);
}

.profile{
text-align:center;
}

.profile img{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:4px solid #D4AF37;
box-shadow:
0 0 15px #D4AF37,
0 0 40px rgba(212,175,55,.5);
}

.name{
font-size:28px;
font-weight:800;
margin-top:15px;
color:#f8d86b;
}

.job{
font-size:14px;
color:#d1d5db;
margin-top:8px;
line-height:1.8;
}

.bio{
margin-top:15px;
font-size:14px;
color:#cbd5e1;
line-height:1.9;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:25px;
}

.btn{
text-decoration:none;
padding:14px;
border-radius:14px;
color:white;
font-weight:700;
text-align:center;
transition:.3s;
display:block;
}

.btn:hover{
transform:translateY(-3px);
}

.call{
background:#1e3a8a;
}

.whatsapp{
background:#16a34a;
}

.map{
background:#b45309;
}

.social{
background:#7c3aed;
}

.save-btn{
width:100%;
margin-top:18px;
padding:16px;
border:none;
border-radius:16px;
font-size:17px;
font-weight:800;
cursor:pointer;
background:linear-gradient(135deg,#f7d56f,#D4AF37);
color:#000;
}

.install-btn{
width:100%;
margin-top:10px;
padding:15px;
border:none;
border-radius:16px;
cursor:pointer;
font-weight:700;
background:#2563eb;
color:white;
}

.qr-btn{
width:100%;
margin-top:10px;
padding:15px;
border:none;
border-radius:16px;
cursor:pointer;
font-weight:700;
background:#111827;
border:1px solid #D4AF37;
color:white;
}

.footer{
margin-top:18px;
text-align:center;
font-size:12px;
color:#9ca3af;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,.9);
align-items:center;
justify-content:center;
z-index:999;
}

.modal-box{
background:#111827;
padding:25px;
border-radius:20px;
text-align:center;
width:90%;
max-width:330px;
border:1px solid #D4AF37;
}

.close{
margin-top:15px;
padding:10px 22px;
border:none;
border-radius:10px;
background:#D4AF37;
cursor:pointer;
font-weight:bold;
}

#qrcode{
display:flex;
justify-content:center;
}

</style>
</head>

<body>

<div class="card">

<div class="profile">

<img src="https://xatimg.com/image/QVmRMogR7WqL.png">

<div class="name">
حسام محسن حسن
</div>

<div class="job">
أخصائي أول لوجيستيك ومشرف حركة<br>
شركة فريدال للصناعات العطرية
</div>

<div class="bio">
متخصص في إدارة العمليات اللوجستية وسلاسل الإمداد
وتحسين حركة النقل والتوزيع لتحقيق أعلى كفاءة تشغيلية.
</div>

</div>

<div class="actions">

<a href="tel:01140320242" class="btn call">
📞 اتصال مباشر
</a>

<a href="https://wa.me/201140320242" target="_blank" class="btn whatsapp">
💬 واتساب
</a>

<a href="https://maps.google.com/?q=شركة+فريدال+للصناعات+العطرية+المنطقة+الصناعية+الثانية"
target="_blank"
class="btn map">
📍 موقع الشركة
</a>

<a href="https://www.linkedin.com/"
target="_blank"
class="btn social">
🌐 السوشيال
</a>

</div>

<button class="save-btn" onclick="downloadVCard()">
➕ احفظ رقمي في هاتفك
</button>

<button class="install-btn" id="installBtn">
📲 تثبيت الكارت كتطبيق
</button>

<button class="qr-btn" onclick="openQR()">
📷 QR Code
</button>

<div class="footer">
Luxury Digital Business Card
</div>

</div>

<div class="modal" id="qrModal">
<div class="modal-box">

<h3 style="margin-bottom:15px;color:#f7d56f">
امسح الكود لفتح الكارت
</h3>

<div id="qrcode"></div>

<button class="close" onclick="closeQR()">
إغلاق
</button>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

function downloadVCard(){

const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:حسام محسن حسن
ORG:شركة فريدال للصناعات العطرية
TITLE:أخصائي أول لوجيستيك ومشرف حركة
TEL;TYPE=CELL:01140320242
EMAIL:hossam.mohsen@fridalegypt.com
END:VCARD`;

const blob=new Blob([vcard],{type:"text/vcard"});
const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download="Hossam_Mohsen.vcf";

document.body.appendChild(a);
a.click();

document.body.removeChild(a);
URL.revokeObjectURL(url);
}

let created=false;

function openQR(){

document.getElementById("qrModal").style.display="flex";

if(!created){

new QRCode(document.getElementById("qrcode"),{
text:window.location.href,
width:220,
height:220,
colorDark:"#D4AF37",
colorLight:"#ffffff"
});

created=true;
}
}

function closeQR(){
document.getElementById("qrModal").style.display="none";
}

let deferredPrompt;

window.addEventListener('beforeinstallprompt',(e)=>{
e.preventDefault();
deferredPrompt=e;
document.getElementById('installBtn').style.display='block';
});

document.getElementById('installBtn').addEventListener('click',async()=>{

if(deferredPrompt){

deferredPrompt.prompt();

const result=await deferredPrompt.userChoice;

deferredPrompt=null;
}
});

</script>

</body>
</html>
